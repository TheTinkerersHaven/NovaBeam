name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'

      - name: Android SDK components
        run: |
          SM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SM" --licenses
          "$SM" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools"

      - run: flutter pub get

      - name: Install gradle wrapper (jar is not committed)
        run: |
          cd android
          BASE="https://raw.githubusercontent.com/gradle/gradle/v8.10.2"
          curl -fsSL --retry 5 --retry-all-errors -o gradlew "$BASE/gradlew"
          curl -fsSL --retry 5 --retry-all-errors -o gradlew.bat "$BASE/gradlew.bat"
          mkdir -p gradle/wrapper
          curl -fsSL --retry 5 --retry-all-errors -o gradle/wrapper/gradle-wrapper.jar "$BASE/gradle/wrapper/gradle-wrapper.jar"
          chmod +x gradlew

      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: novabeam-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: NovaBeam APK (latest build of main)
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk

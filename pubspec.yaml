name: novabeam
description: >-
  Android Beam, rebuilt with Flutter: tap two phones over NFC to bootstrap a
  Nearby Connections session, then transfer files at Wi-Fi speed, fully offline.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
